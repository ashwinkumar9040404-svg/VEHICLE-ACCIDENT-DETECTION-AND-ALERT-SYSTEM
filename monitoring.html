<!DOCTYPE html>
<html>
<head>
  <title>Monitoring</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app"
  style="display:flex; flex-direction:column; justify-content:center; text-align:center;">

  <h2>Monitoring</h2>
  <p class="subtitle">Sensors Active</p>

  <div class="card">
    <p><strong>Accelerometer Data</strong></p>
    <p>X: 0.3</p>
    <p>Y: 0.2</p>
    <p>Z: 9.7</p>
  </div>

  <button class="btn danger" onclick="goTo('alert.html')">
    Accident Detected
  </button>

  <div class="screen-label">MONITORING</div>
</div>

<script>
function goTo(page){
  document.body.classList.add("exit");
  setTimeout(()=>{ window.location.href = page; },400);
}
</script>

</body>
</html>
